# Lädt den Ordner public/ bei jeder Änderung verschlüsselt (FTPS) auf den All-Inkl-Webspace.
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER   = dein KAS-Login + .kasserver.com, z. B. w0123456.kasserver.com
#   FTP_USERNAME = Name des FTP-Zugangs (beschränkt auf den Ordner der Subdomain)
#   FTP_PASSWORD = Passwort des FTP-Zugangs
name: Deploy zu All-Inkl

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Dateien per FTPS hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./public/
          server-dir: ./
